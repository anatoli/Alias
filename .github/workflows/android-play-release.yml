# Android release → Google Play (AAB)
#
# Required GitHub secrets:
#   ANDROID_KEYSTORE_BASE64   — base64 of upload keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — Google Play Console service account JSON

name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-fund --no-audit

      - name: Prepare Cordova project skeleton
        run: |
          # Cordova expects www/ to exist before platform add
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '%s\n' '<!doctype html><html><body>Alias</body></html>' > www/index.html
          fi
          test -f config.xml
          # Validate XML declaration (must be 1.0, app version is on <widget>)
          head -n 1 config.xml

      - name: Add Android platform
        run: |
          # platforms/ is gitignored — always add fresh on CI
          rm -rf platforms/android plugins/android.json
          npx cordova platform add android

      - name: Decode keystore + signing properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/alias-upload.jks"
          cat > release-signing.properties <<EOF
          storeFile=$HOME/alias-upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          cp release-signing.properties platforms/android/release-signing.properties
          echo "cdvReleaseSigningPropertiesFile=release-signing.properties" >> platforms/android/gradle.properties

      - name: Build release AAB
        env:
          REACT_APP_WORDS_URL: ${{ vars.REACT_APP_WORDS_URL }}
          REACT_APP_ADMOB_INTERSTITIAL_ID: ${{ vars.REACT_APP_ADMOB_INTERSTITIAL_ID }}
          REACT_APP_SUBSCRIPTION_PRODUCT_ID: ${{ vars.REACT_APP_SUBSCRIPTION_PRODUCT_ID }}
        run: |
          npx cordova build android --release -- --packageType=bundle

      - name: Find AAB
        id: aab
        run: |
          AAB=$(find platforms/android -name "*.aab" | head -n 1)
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          test -n "$AAB"
          ls -la "$AAB"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.AAA.Alias
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
