# Android release → Google Play (AAB)
#
# Required GitHub secrets:
#   ANDROID_KEYSTORE_BASE64   — base64 of upload keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — Google Play Console service account JSON

name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-fund --no-audit

      - name: Prepare Cordova project skeleton
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '%s\n' '<!doctype html><html><body>Alias</body></html>' > www/index.html
          fi
          test -f config.xml
          head -n 1 config.xml

      - name: Add Android platform
        run: |
          rm -rf platforms/android plugins/android.json
          npx cordova platform add android

      - name: Decode keystore + write build.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$HOME/alias-upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          # List aliases to fail fast if keystore/password wrong
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" | head -n 20

          # Cordova signing via build.json (avoid fragile release-signing.properties)
          python3 - <<'PY'
          import json, os
          cfg = {
            "android": {
              "release": {
                "keystore": os.path.expanduser("~/alias-upload.jks"),
                "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
                "alias": os.environ["ANDROID_KEY_ALIAS"],
                "password": os.environ["ANDROID_KEY_PASSWORD"],
                "keystoreType": "jks",
                "packageType": "bundle"
              }
            }
          }
          with open("build.json", "w", encoding="utf-8") as f:
            json.dump(cfg, f, indent=2)
          print("Wrote build.json")
          PY

      - name: Build signed release AAB
        env:
          REACT_APP_WORDS_URL: ${{ vars.REACT_APP_WORDS_URL }}
          REACT_APP_ADMOB_INTERSTITIAL_ID: ${{ vars.REACT_APP_ADMOB_INTERSTITIAL_ID }}
          REACT_APP_SUBSCRIPTION_PRODUCT_ID: ${{ vars.REACT_APP_SUBSCRIPTION_PRODUCT_ID }}
        run: |
          set -euo pipefail
          npx cordova build android --release --buildConfig=build.json -- --packageType=bundle

      - name: Find and verify AAB signature
        id: aab
        run: |
          set -euo pipefail
          AAB=$(find platforms/android -path '*/outputs/bundle/*/*.aab' -o -name '*-release.aab' | head -n 1)
          if [ -z "${AAB}" ]; then
            AAB=$(find platforms/android -name '*.aab' | head -n 1)
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          test -n "$AAB"
          test -f "$AAB"
          ls -la "$AAB"
          # jarsigner often exits 1 on cert-chain warnings even when the bundle is signed
          set +e
          jarsigner -verify -verbose -certs "$AAB" 2>&1 | tee /tmp/aab-verify.txt
          set -e
          if ! grep -qiE 'jar verified|verified\.' /tmp/aab-verify.txt; then
            echo "::error::AAB signature verification failed"
            tail -n 80 /tmp/aab-verify.txt || true
            exit 1
          fi
          echo "AAB signature OK: $AAB"
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.AAA.Alias
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft
